name: IDD intent dispatch

on:
  workflow_dispatch:
    inputs:
      intent:
        description: What outcome do you want? (goal, why, constraints)
        required: true
        type: string
      kind:
        description: Kind of work
        required: true
        default: feature
        type: choice
        options:
          - feature
          - fix
          - refactor
          - docs
          - research
      implement:
        description: Implement it now (branch + PR), or plan only?
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: idd-dispatch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: devstroop/setup-opencode@main
        with:
          version: latest

      - name: Execute intent
        env:
          GH_TOKEN: ${{ github.token }}
          IDD_INTENT: ${{ github.event.inputs.intent }}
          IDD_KIND: ${{ github.event.inputs.kind }}
          IDD_IMPLEMENT: ${{ github.event.inputs.implement }}
          IDD_BRANCH: idd/${{ github.ref_name }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || '' }}
        run: |
          if [ "$IDD_IMPLEMENT" = "true" ]; then
            for model in ${OPENCODE_MODEL:-opencode/big-pickle opencode/deepseek-v4-flash-free opencode/mimo-v2.5-free}; do
              [ -z "$model" ] && continue
              echo "trying model: $model"
              if timeout 600 opencode run -m "$model" \
                "Implement this intent ($IDD_KIND): $IDD_INTENT"; then
                echo "used model: $model"
                break
              fi
            done
          else
            rm -f /tmp/idd-reply.md /tmp/events.jsonl
            for model in ${OPENCODE_MODEL:-opencode/big-pickle opencode/deepseek-v4-flash-free opencode/mimo-v2.5-free}; do
              [ -z "$model" ] && continue
              echo "trying model: $model"
              if timeout 300 opencode run --format json -m "$model" --agent triage \
                "Plan only ($IDD_KIND): $IDD_INTENT" > /tmp/events.jsonl 2>&1 \
                && [ -s /tmp/idd-reply.md ]; then
                echo "used model: $model"
                break
              fi
            done
            if [ ! -s /tmp/idd-reply.md ]; then
              jq -r 'select(.type=="message.part.updated") | .properties.part | select(.type=="text") | .text' \
                /tmp/events.jsonl 2>/dev/null \
                | tac | awk '/^[[:space:]]*$/{if (n) exit; next} {n=1; print}' | tac > /tmp/idd-reply.md
            fi
            [ -s /tmp/idd-reply.md ] || echo "No plan generated." > /tmp/idd-reply.md
            gh issue create --title "Plan: $(echo "$IDD_INTENT" | head -c 60)" \
              --body-file /tmp/idd-reply.md
          fi