name: IDD comment

on:
  issue_comment:
    types: [created, edited]

permissions:
  issues: write
  pull-requests: write
  contents: write
  checks: read

concurrency:
  group: idd-thread-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  respond:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: devstroop/setup-opencode@main
        with:
          version: latest
          config: .config/opencode/config.json

      - name: Acknowledge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/reactions" \
            -H "Accept: application/vnd.github.squirrel-girl-preview+json" \
            -f content=eyes || true

      - name: Parse intent (slash command or panel tick)
        id: cmd
        env:
          ACTION: ${{ github.event.action }}
          BODY: ${{ github.event.comment.body }}
          FROM: ${{ github.event.changes.body.from || '' }}
        run: |
          CMD=""
          if [ "$ACTION" = "created" ]; then
            if [[ "$BODY" =~ ^/[a-z][a-z-]* ]]; then
              CMD="${BODY%% *}"
            fi
          else
            FROMSET="$(printf '%s' "$FROM" | grep '^- \[x\]' | grep -oE '/(plan|review|implement|close)' || true)"
            for c in $(printf '%s' "$BODY" | grep '^- \[x\]' | grep -oE '/(plan|review|implement|close)' || true); do
              case " $FROMSET " in
                *" $c "*) ;;
                *) CMD="$c"; break ;;
              esac
            done
            if [ -z "$CMD" ]; then
              if [[ "$BODY" =~ ^/(plan|review|implement|close) ]]; then
                CMD="${BODY%% *}"
              fi
            fi
          fi
          echo "command=$CMD" >> "$GITHUB_OUTPUT"
          echo "Parsed command: ${CMD:-<none>}"

      - name: Guard /implement
        if: >-
          steps.cmd.outputs.command == 'implement' &&
          !contains(fromJson('["OWNER","COLLABORATOR","MEMBER"]'), github.event.sender.author_association)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "**/implement blocked** — only OWNER, COLLABORATOR, or MEMBER can request implementation. Tick \`/plan\` or \`/review\` in the 🤖 panel instead."

      - name: Mark running in panel
        if: steps.cmd.outputs.command != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.cmd.outputs.command }}" != "feedback" ]; then
            ./scripts/idd-panel.sh check "${{ github.repository }}" \
              "${{ github.event.issue.number }}" "${{ steps.cmd.outputs.command }}" \
              "⏳ ${{ steps.cmd.outputs.command }} running…"
          fi

      - name: Run triage agent
        if: >-
          steps.cmd.outputs.command != '' &&
          !(steps.cmd.outputs.command == 'implement' &&
            !contains(fromJson('["OWNER","COLLABORATOR","MEMBER"]'), github.event.sender.author_association))
        env:
          GH_TOKEN: ${{ github.token }}
          IDD_REPO: ${{ github.repository }}
          IDD_NUMBER: ${{ github.event.issue.number }}
          IDD_KIND: ${{ github.event.issue.pull_request && 'pr' || 'issue' }}
          IDD_COMMENT: ${{ github.event.comment.body }}
          IDD_AUTHOR: ${{ github.event.sender.login }}
          IDD_COMMAND: ${{ steps.cmd.outputs.command }}
          IDD_ALLOWED: ${{ contains(fromJson('["OWNER","COLLABORATOR","MEMBER"]'), github.event.sender.author_association) }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || '' }}
        run: |
          rm -f /tmp/idd-reply.md /tmp/events.jsonl
          if [ -n "$OPENCODE_MODEL" ]; then
            timeout 300 opencode run --format json -m "$OPENCODE_MODEL" --agent triage \
              "Handle '$IDD_COMMAND' on $IDD_KIND #$IDD_NUMBER" > /tmp/events.jsonl 2>&1
          else
            timeout 300 opencode run --format json --agent triage \
              "Handle '$IDD_COMMAND' on $IDD_KIND #$IDD_NUMBER" > /tmp/events.jsonl 2>&1
          fi
          if [ ! -s /tmp/idd-reply.md ]; then
            jq -r 'select(.type=="text") | .part.text' \
              /tmp/events.jsonl 2>/dev/null \
              | tac | awk '/^[[:space:]]*$/{if (n) exit; next} {n=1; print}' | tac > /tmp/idd-reply.md
          fi
          if [ ! -s /tmp/idd-reply.md ]; then
            echo "No reply generated." > /tmp/idd-reply.md
            echo "event tail:"; tail -3 /tmp/events.jsonl
          fi
          gh issue comment "$IDD_NUMBER" --repo "$IDD_REPO" --body-file /tmp/idd-reply.md

      - name: Reset panel
        if: steps.cmd.outputs.command != '' && steps.cmd.outputs.command != 'feedback'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/idd-panel.sh reset "${{ github.repository }}" \
            "${{ github.event.issue.number }}" \
            "✅ ${{ steps.cmd.outputs.command }} finished"

      - name: Done
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/reactions" \
            -H "Accept: application/vnd.github.squirrel-girl-preview+json" \
            -f content=+1 || true