name: IDD format issue

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

concurrency:
  group: idd-issue-${{ github.event.issue.number }}-format
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: devstroop/setup-opencode@main
        with:
          version: latest
          config: .config/opencode/config.json

      - name: Reformat title and body
        env:
          GH_TOKEN: ${{ github.token }}
          IDD_KIND: issue
          IDD_NUMBER: ${{ github.event.issue.number }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || '' }}
        run: |
          IDD_INPUT_JSON="$(gh issue view "$IDD_NUMBER" --json title,body --jq '{title, body}')"
          if [ -n "$OPENCODE_MODEL" ]; then
            timeout 300 opencode run -m "$OPENCODE_MODEL" --agent formatter \
              "Reformat $IDD_KIND #$IDD_NUMBER. Current content: $IDD_INPUT_JSON" 2>&1
          else
            timeout 300 opencode run --agent formatter \
              "Reformat $IDD_KIND #$IDD_NUMBER. Current content: $IDD_INPUT_JSON" 2>&1
          fi
          jq -e . .idd/result.json > /dev/null || exit 1
          jq -e . .idd/result.json > /dev/null
          TITLE="$(jq -r .title .idd/result.json)"
          jq -r .body .idd/result.json > /tmp/body.md
          gh issue edit "$IDD_NUMBER" --title "$TITLE" --body-file /tmp/body.md
          gh issue edit "$IDD_NUMBER" --add-label idd-formatted || true

      - name: Post actions panel
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/idd-panel.sh post "${{ github.repository }}" "${{ github.event.issue.number }}"