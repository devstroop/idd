name: IDD format PR

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: idd-pr-${{ github.event.pull_request.number }}-format
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: devstroop/setup-opencode@main
        with:
          version: latest
          config: .config/opencode/config.json

      - name: Reformat title and body
        env:
          GH_TOKEN: ${{ github.token }}
          IDD_KIND: pr
          IDD_NUMBER: ${{ github.event.pull_request.number }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || '' }}
        run: |
          IDD_INPUT_JSON="$(gh pr view "$IDD_NUMBER" --json title,body --jq '{title, body}')"
          if [ -n "$OPENCODE_MODEL" ]; then
            timeout 300 opencode run -m "$OPENCODE_MODEL" --agent formatter \
              "Reformat $IDD_KIND #$IDD_NUMBER. Current content: $IDD_INPUT_JSON" 2>&1
          else
            timeout 300 opencode run --agent formatter \
              "Reformat $IDD_KIND #$IDD_NUMBER. Current content: $IDD_INPUT_JSON" 2>&1
          fi
          jq -e . .idd/result.json > /dev/null || exit 1
          jq -e . .idd/result.json > /dev/null
          TITLE="$(jq -r .title .idd/result.json)"
          jq -r .body .idd/result.json > /tmp/body.md
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$IDD_NUMBER" \
            --input <(jq -n --arg t "$TITLE" --arg b "$(cat /tmp/body.md)" '{title:$t, body:$b}')

      - name: Append approve checklist
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="$(jq -r .body .idd/result.json)"
          if ! printf '%s' "$BODY" | grep -q "Approve & merge"; then
            printf '\n%s\n' "$BODY" > /tmp/body2.md
            cat .config/opencode/checklist.md >> /tmp/body2.md
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$IDD_NUMBER" \
              --input <(jq -n --arg b "$(cat /tmp/body2.md)" '{body:$b}')
          fi

      - name: Post actions panel
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          IDD_KIND: pr
        run: |
          ./scripts/idd-panel.sh post "${{ github.repository }}" "${{ github.event.pull_request.number }}"