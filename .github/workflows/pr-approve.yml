name: IDD approve

on:
  pull_request:
    types: [edited]
  issue_comment:
    types: [created, edited]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: idd-pr-${{ github.event.pull_request.number || github.event.issue.number }}-approve
  cancel-in-progress: false

jobs:
  merge:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dump event fields
        run: |
          jq '{sender:.sender.login, sender_assoc:.sender.author_association, pr_user:.pull_request.user.login, pr_assoc:.pull_request.user.author_association, comment_user:.comment.user.login, comment_assoc:.comment.user.author_association}' "$GITHUB_EVENT_PATH"

      - name: Guard (OWNER/COLLABORATOR/MEMBER)
        id: guard
        run: |
          ASSOC="$(jq -r '.comment.user.author_association // .pull_request.user.author_association // .sender.author_association // "NONE"' "$GITHUB_EVENT_PATH")"
          case ",OWNER,COLLABORATOR,MEMBER," in
            *",$ASSOC,"*) echo "allowed=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "allowed=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "association=$ASSOC allowed=$(grep '^allowed=' "$GITHUB_OUTPUT" | cut -d= -f2)"

      - name: Detect approve tick
        if: steps.guard.outputs.allowed == 'true'
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          FROM: ${{ github.event.changes.body.from || '' }}
          BODY: ${{ github.event.pull_request.body || github.event.comment.body }}
          IDD_MERGE_METHOD: ${{ vars.IDD_MERGE_METHOD || 'squash' }}
        run: |
          APPROVE=""
          if [ "$EVENT" = "issue_comment" ]; then
            if [ "${{ github.event.issue.pull_request }}" = "{}" ]; then
              echo "not a PR comment — ignoring"
              exit 0
            fi
            grep -q -- '- \[x\] Approve & merge' <<< "$BODY" || exit 0
            grep -q -- '- \[x\] Approve & merge' <<< "$FROM" && exit 0
            APPROVE=true
          else
            grep -q -- '- \[x\] Approve & merge' <<< "$BODY" || exit 0
            grep -q -- '- \[x\] Approve & merge' <<< "$FROM" && exit 0
            APPROVE=true
          fi
          echo "approve=$APPROVE" >> "$GITHUB_OUTPUT"
          echo "method=$IDD_MERGE_METHOD" >> "$GITHUB_OUTPUT"
          echo "Approve & merge ticked"

      - name: Merge and report
        if: steps.detect.outputs.approve == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ github.event.pull_request.number || github.event.issue.number }}"
          REPO="${{ github.repository }}"
          BODY="$(gh pr view "$PR" --repo "$REPO" --json body -q .body)"
          printf '%s' "$BODY" | sed 's/^- \[x\] Approve & merge/- [ ] Approve \& merge/' > /tmp/pr-body.md
          gh api -X PATCH "repos/$REPO/pulls/$PR" \
            --input <(jq -n --arg b "$(cat /tmp/pr-body.md)" '{body:$b}')
          if gh pr merge "$PR" --repo "$REPO" --${{ steps.detect.outputs.method }}; then
            gh pr comment "$PR" --repo "$REPO" --body "✅ Merged via the approve checklist."
          else
            gh pr comment "$PR" --repo "$REPO" --body "❌ Merge failed — resolve conflicts, then tick **Approve & merge** again."
          fi